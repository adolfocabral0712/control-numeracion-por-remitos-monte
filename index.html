<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Remitos de Origen</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231d4ed8'/%3E%3Cpath d='M17 15h30v34H17z' fill='white'/%3E%3Cpath d='M23 24h18M23 32h18M23 40h12' stroke='%231d4ed8' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root { --azul:#1d4ed8; --azul-oscuro:#163d9f; --azul-suave:#dbeafe; --fondo:#eef2f7; --blanco:#fff; --texto:#172033; --suave:#64748b; --borde:#cbd5e1; --alternada:#f8fafc; --hover:#dbeafe; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; }
    body { overflow:hidden; background:var(--fondo); color:var(--texto); font-family:Arial,Helvetica,sans-serif; }
    .pagina { display:flex; flex-direction:column; width:100%; height:100vh; height:100dvh; padding:16px; gap:12px; }
    .encabezado { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:15px 18px; background:var(--blanco); border:1px solid var(--borde); border-radius:12px; box-shadow:0 4px 14px rgba(15,23,42,.07); }
    h1 { margin:0; color:var(--azul-oscuro); font-size:1.35rem; line-height:1.2; }
    .actualizacion { margin-top:5px; color:var(--suave); font-size:.88rem; }
    .contador { flex:0 0 auto; min-width:145px; padding:10px 14px; text-align:center; background:var(--azul-suave); color:var(--azul-oscuro); border:1px solid #93c5fd; border-radius:10px; }
    .contador-numero { display:block; font-size:1.35rem; font-weight:700; }
    .contador-texto { display:block; margin-top:2px; font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
    .estado { display:none; flex:0 0 auto; padding:11px 14px; border-radius:8px; font-size:.9rem; font-weight:700; }
    .estado.visible { display:block; }
    .estado.error { color:#991b1b; background:#fee2e2; border:1px solid #fca5a5; }
    .tabla-contenedor { flex:1 1 auto; min-width:0; min-height:0; overflow:auto; scrollbar-gutter:stable; background:var(--blanco); border:1px solid var(--borde); border-radius:12px; box-shadow:0 4px 14px rgba(15,23,42,.07); }
    table { width:max-content; min-width:max-content; table-layout:auto; border-collapse:separate; border-spacing:0; font-size:calc(.82rem - 2px); }
    thead { position:sticky; top:0; z-index:10; }
    th { width:1%; height:36px; padding:8px 7px; white-space:nowrap; text-align:center; line-height:1.35; vertical-align:middle; color:#fff; background:var(--azul); border-right:1px solid rgba(255,255,255,.25); border-bottom:1px solid var(--azul-oscuro); }
    .filtro-celda { height:34px; padding:4px; background:#dbeafe; border-right:1px solid #bfdbfe; border-bottom:1px solid #93c5fd; }
    .filtro-select { width:100%; min-width:72px; height:26px; padding:2px 22px 2px 5px; color:#172033; background:#fff; border:1px solid #93c5fd; border-radius:5px; font:inherit; cursor:pointer; }
    .filtro-select:focus { outline:2px solid #2563eb; outline-offset:1px; }
    td { width:1%; height:32px; padding:6px 7px; white-space:nowrap; text-align:center; line-height:1.35; vertical-align:middle; border-right:1px solid #e2e8f0; border-bottom:1px solid #e2e8f0; }
    td.celda-color { font-weight:700; border-bottom-color:rgba(15,23,42,.16); }
    td.fecha-semana { color:#713f12; background:#fde68a; font-weight:700; }
    th:last-child, td:last-child { border-right:0; }
    tbody tr:nth-child(even) { background:var(--alternada); }
    tbody tr:hover { background:var(--hover); }
    .cargando td, .sin-datos td { height:130px; color:var(--suave); font-size:1rem; text-align:center; }
    .tabla-contenedor::-webkit-scrollbar { width:14px; height:14px; }
    .tabla-contenedor::-webkit-scrollbar-track { background:#e2e8f0; }
    .tabla-contenedor::-webkit-scrollbar-thumb { background:#64748b; border:3px solid #e2e8f0; border-radius:10px; }
    .tabla-contenedor::-webkit-scrollbar-thumb:hover { background:#475569; }
    @media (max-width:700px) {
      .pagina { padding:8px; gap:8px; }
      .encabezado { align-items:stretch; flex-direction:column; padding:12px; gap:10px; }
      h1, .actualizacion { text-align:center; }
      h1 { font-size:1.08rem; }
      .contador { width:100%; }
      table { font-size:calc(.75rem - 2px); }
      th { height:34px; padding:7px 6px; }
      td { height:30px; padding:5px 6px; }
    }
  </style>
</head>
<body>
  <main class="pagina">
    <header class="encabezado">
      <div>
        <h1>Control de Remitos de Origen</h1>
        <div id="actualizacion" class="actualizacion">Cargando información...</div>
      </div>
      <div class="contador">
        <span id="cantidad" class="contador-numero">0</span>
        <span class="contador-texto">Registros</span>
      </div>
    </header>
    <div id="estado" class="estado" role="alert"></div>
    <section class="tabla-contenedor" aria-label="Listado de remitos de origen">
      <table>
        <thead>
          <tr id="encabezados"></tr>
          <tr id="filtros"></tr>
        </thead>
        <tbody id="cuerpo-tabla"><tr class="cargando"><td>Cargando datos...</td></tr></tbody>
      </table>
    </section>
  </main>
  <script>
    const JSON_URL = "https://dl.dropbox.com/scl/fi/f0s5t8uwgbr275fyggvbk/ControlRemitosOrigen.json?rlkey=k0ygvtoajiwl2x542rpdez1c3&dl=1";
    const encabezadosElemento = document.getElementById("encabezados");
    const filtrosElemento = document.getElementById("filtros");
    const cuerpoElemento = document.getElementById("cuerpo-tabla");
    const actualizacionElemento = document.getElementById("actualizacion");
    const cantidadElemento = document.getElementById("cantidad");
    const estadoElemento = document.getElementById("estado");
    const COLUMNAS_CON_COLOR = new Set(["deposito", "certificacion", "origen", "nombreprod2"]);
    const COLUMNAS_COLOR_COMPARTIDO = new Set(["cosecha", "sacada", "carga"]);
    let columnasActuales = [];
    let registrosOriginales = [];

    const nombreVisible = columna => String(columna).replaceAll("_", " ").toUpperCase();
    function formatearFecha(valor) {
      const texto = String(valor ?? "").trim();
      if (!texto) return "";

      let coincidencia = texto.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (coincidencia) {
        const [, anio, mes, dia] = coincidencia;
        return `${dia.padStart(2, "0")}/${mes.padStart(2, "0")}/${anio.slice(-2)}`;
      }

      coincidencia = texto.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
      if (coincidencia) {
        const [, dia, mes, anio] = coincidencia;
        return `${dia.padStart(2, "0")}/${mes.padStart(2, "0")}/${anio.slice(-2)}`;
      }

      return texto;
    }

    function convertirFechaADias(valor) {
      const texto = String(valor ?? "").trim();
      let coincidencia = texto.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);

      if (coincidencia) {
        return Math.floor(Date.UTC(
          Number(coincidencia[1]),
          Number(coincidencia[2]) - 1,
          Number(coincidencia[3])
        ) / 86400000);
      }

      coincidencia = texto.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
      if (coincidencia) {
        let anio = Number(coincidencia[3]);
        if (anio < 100) anio += 2000;

        return Math.floor(Date.UTC(
          anio,
          Number(coincidencia[2]) - 1,
          Number(coincidencia[1])
        ) / 86400000);
      }

      return null;
    }

    function obtenerHoyUruguayEnDias() {
      const partes = new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/Montevideo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());

      const valores = Object.fromEntries(
        partes.filter(parte => parte.type !== "literal").map(parte => [parte.type, parte.value])
      );

      return Math.floor(Date.UTC(
        Number(valores.year),
        Number(valores.month) - 1,
        Number(valores.day)
      ) / 86400000);
    }

    function estaEnSemanaMovil(valor) {
      const fecha = convertirFechaADias(valor);
      if (fecha === null) return false;

      const hoy = obtenerHoyUruguayEnDias();
      return fecha >= hoy - 7 && fecha <= hoy;
    }

    function formatearHora(valor) {
      const texto = String(valor ?? "").trim();
      if (!texto) return "";
      const coincidencia = texto.match(/(?:^|[ T])(\d{1,2}):(\d{2})(?::\d{2})?/);
      return coincidencia
        ? `${coincidencia[1].padStart(2, "0")}:${coincidencia[2]}`
        : texto;
    }

    function mostrarValor(columna, valor) {
      if (valor === null || valor === undefined || valor === "") return "";
      const nombre = String(columna).toLowerCase();
      if (nombre === "fecharto") return formatearFecha(valor);
      if (nombre === "horarto" || nombre === "horasalida") return formatearHora(valor);
      return String(valor);
    }

    function crearMapasColores(columnas, registros) {
      const mapas = new Map();

      const columnasCompartidas = columnas.filter(columna =>
        COLUMNAS_COLOR_COMPARTIDO.has(String(columna).toLowerCase())
      );

      const valoresCompartidos = [...new Set(
        registros.flatMap(registro =>
          columnasCompartidas.map(columna =>
            mostrarValor(columna, registro[columna]).trim()
          )
        ).filter(Boolean)
      )].sort((a, b) => a.localeCompare(b, "es", { sensitivity:"base" }));

      const mapaCompartido = new Map();
      valoresCompartidos.forEach((valor, indice) => {
        const tono = (indice * 137.508 + 205) % 360;
        const saturacion = 68 + (indice % 3) * 5;
        const luminosidad = 82 + (indice % 2) * 5;
        mapaCompartido.set(valor, `hsl(${tono.toFixed(2)} ${saturacion}% ${luminosidad}%)`);
      });

      columnasCompartidas.forEach(columna => {
        mapas.set(String(columna).toLowerCase(), mapaCompartido);
      });

      columnas.forEach(columna => {
        const nombre = String(columna).toLowerCase();
        if (!COLUMNAS_CON_COLOR.has(nombre)) return;

        const valores = [...new Set(
          registros
            .map(registro => mostrarValor(columna, registro[columna]).trim())
            .filter(Boolean)
        )].sort((a, b) => a.localeCompare(b, "es", { sensitivity:"base" }));

        const colores = new Map();
        valores.forEach((valor, indice) => {
          const tono = (indice * 137.508 + 18) % 360;
          const saturacion = 68 + (indice % 3) * 5;
          const luminosidad = 82 + (indice % 2) * 5;
          colores.set(valor, `hsl(${tono.toFixed(2)} ${saturacion}% ${luminosidad}%)`);
        });

        mapas.set(nombre, colores);
      });

      return mapas;
    }

    function mostrarError(mensaje) {
      encabezadosElemento.replaceChildren();
      filtrosElemento.replaceChildren();
      cuerpoElemento.replaceChildren();
      const fila = document.createElement("tr");
      fila.className = "sin-datos";
      const celda = document.createElement("td");
      celda.textContent = "No fue posible cargar los datos.";
      fila.appendChild(celda);
      cuerpoElemento.appendChild(fila);
      estadoElemento.textContent = mensaje;
      estadoElemento.className = "estado error visible";
      actualizacionElemento.textContent = "Información no disponible";
      cantidadElemento.textContent = "0";
    }

    function construirEncabezados(columnas) {
      encabezadosElemento.replaceChildren();
      const fragmento = document.createDocumentFragment();
      columnas.forEach(columna => {
        const th = document.createElement("th");
        th.scope = "col";
        th.textContent = nombreVisible(columna);
        fragmento.appendChild(th);
      });
      encabezadosElemento.appendChild(fragmento);
    }

    function construirFiltros(columnas, registros) {
      filtrosElemento.replaceChildren();
      const fragmento = document.createDocumentFragment();

      columnas.forEach(columna => {
        const celda = document.createElement("th");
        celda.className = "filtro-celda";

        const selector = document.createElement("select");
        selector.className = "filtro-select";
        selector.dataset.columna = columna;
        selector.setAttribute("aria-label", `Filtrar ${nombreVisible(columna)}`);

        const todos = document.createElement("option");
        todos.value = "";
        todos.textContent = "Todos";
        selector.appendChild(todos);

        const valores = [...new Set(
          registros
            .map(registro => mostrarValor(columna, registro[columna]))
            .filter(Boolean)
        )].sort((a, b) => a.localeCompare(b, "es", { numeric:true, sensitivity:"base" }));

        valores.forEach(valor => {
          const opcion = document.createElement("option");
          opcion.value = valor;
          opcion.textContent = valor;
          selector.appendChild(opcion);
        });

        selector.addEventListener("change", aplicarFiltros);
        celda.appendChild(selector);
        fragmento.appendChild(celda);
      });

      filtrosElemento.appendChild(fragmento);
    }

    function aplicarFiltros() {
      const filtrosActivos = [...filtrosElemento.querySelectorAll("select")]
        .filter(selector => selector.value !== "")
        .map(selector => ({
          columna: selector.dataset.columna,
          valor: selector.value
        }));

      const registrosFiltrados = registrosOriginales.filter(registro =>
        filtrosActivos.every(filtro =>
          mostrarValor(filtro.columna, registro[filtro.columna]) === filtro.valor
        )
      );

      construirFilas(columnasActuales, registrosFiltrados);

      cantidadElemento.textContent = filtrosActivos.length
        ? `${registrosFiltrados.length.toLocaleString("es-UY")} / ${registrosOriginales.length.toLocaleString("es-UY")}`
        : registrosOriginales.length.toLocaleString("es-UY");
    }

    function construirFilas(columnas, registros) {
      cuerpoElemento.replaceChildren();
      if (!registros.length) {
        const fila = document.createElement("tr");
        fila.className = "sin-datos";
        const celda = document.createElement("td");
        celda.colSpan = Math.max(columnas.length, 1);
        celda.textContent = "No hay registros para mostrar.";
        fila.appendChild(celda);
        cuerpoElemento.appendChild(fila);
        return;
      }
      const mapasColores = crearMapasColores(columnas, registros);
      const fragmento = document.createDocumentFragment();
      registros.forEach(registro => {
        const fila = document.createElement("tr");
        columnas.forEach(columna => {
          const celda = document.createElement("td");
          const valor = mostrarValor(columna, registro[columna]);
          celda.textContent = valor;
          celda.title = valor;

          if (
            String(columna).toLowerCase() === "fecharto" &&
            estaEnSemanaMovil(registro[columna])
          ) {
            celda.classList.add("fecha-semana");
          }

          const mapaColumna = mapasColores.get(String(columna).toLowerCase());
          const color = mapaColumna?.get(valor.trim());
          if (color) {
            celda.classList.add("celda-color");
            celda.style.backgroundColor = color;
          }

          fila.appendChild(celda);
        });
        fragmento.appendChild(fila);
      });
      cuerpoElemento.appendChild(fragmento);
    }

    async function cargarDatos() {
      try {
        estadoElemento.className = "estado";
        const respuesta = await fetch(`${JSON_URL}&t=${Date.now()}`, { cache:"no-store", headers:{ Accept:"application/json" } });
        if (!respuesta.ok) throw new Error(`Estado ${respuesta.status}`);
        const contenido = await respuesta.json();
        const registros = Array.isArray(contenido.datos) ? contenido.datos : [];
        let columnas = Array.isArray(contenido.columnas) ? contenido.columnas : [];
        if (!columnas.length && registros.length) columnas = Object.keys(registros[0]);
        columnas = columnas.filter(columna => String(columna).toLowerCase() !== "nombrefas");
        columnasActuales = columnas;
        registrosOriginales = registros;
        construirEncabezados(columnasActuales);
        construirFiltros(columnasActuales, registrosOriginales);
        construirFilas(columnasActuales, registrosOriginales);
        cantidadElemento.textContent = registrosOriginales.length.toLocaleString("es-UY");
        actualizacionElemento.textContent = contenido.actualizado ? `Actualizado: ${contenido.actualizado}` : "Actualización sin fecha informada";
      } catch (error) {
        console.error(error);
        mostrarError("No se pudo leer el JSON de Dropbox. Comprueba que el enlace continúe siendo público.");
      }
    }

    cargarDatos();
  </script>
</body>
</html>
