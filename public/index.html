<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Remitos de Origen</title>
  <style>
    :root{--azul:#1d4ed8;--azul-oscuro:#163d9f;--azul-suave:#dbeafe;--fondo:#eef2f7;--blanco:#fff;--texto:#172033;--suave:#64748b;--borde:#cbd5e1;--alternada:#f8fafc;--hover:#e0ecff}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:var(--fondo);color:var(--texto);font-family:Arial,Helvetica,sans-serif}
    .pagina{display:flex;flex-direction:column;width:100%;height:100vh;height:100dvh;padding:14px;gap:10px}.encabezado{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 17px;background:#fff;border:1px solid var(--borde);border-radius:12px;box-shadow:0 4px 14px rgba(15,23,42,.07)}
    h1{margin:0;color:var(--azul-oscuro);font-size:1.25rem;line-height:1.2}.actualizacion{margin-top:5px;color:var(--suave);font-size:.82rem}.contador{flex:0 0 auto;min-width:150px;padding:9px 13px;text-align:center;background:var(--azul-suave);color:var(--azul-oscuro);border:1px solid #93c5fd;border-radius:10px}.contador.alerta{color:#991b1b;background:#fee2e2;border-color:#fca5a5}.contador-numero{display:block;font-size:1.3rem;font-weight:700}.contador-texto{display:block;margin-top:2px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
    .pestanas{flex:0 0 auto;display:flex;gap:7px;padding:6px;overflow-x:auto;background:#fff;border:1px solid var(--borde);border-radius:10px}.pestana{min-height:34px;padding:7px 14px;white-space:nowrap;color:#334155;background:#f8fafc;border:1px solid #cbd5e1;border-radius:7px;font-weight:700;cursor:pointer}.pestana:hover{background:#e2e8f0}.pestana.activa{color:#fff;background:var(--azul);border-color:var(--azul)}.pestana .insignia{display:inline-block;min-width:22px;margin-left:7px;padding:2px 6px;color:inherit;background:rgba(255,255,255,.2);border-radius:999px;font-size:.72rem}
    .estado{display:none;flex:0 0 auto;padding:10px 13px;border-radius:8px;font-size:.85rem;font-weight:700}.estado.visible{display:block}.estado.error{color:#991b1b;background:#fee2e2;border:1px solid #fca5a5}.tabla-contenedor{flex:1 1 auto;min-width:0;min-height:0;overflow:auto;scrollbar-gutter:stable;background:#fff;border:1px solid var(--borde);border-radius:12px;box-shadow:0 4px 14px rgba(15,23,42,.07)}
    table{width:max-content;min-width:max-content;table-layout:auto;border-collapse:separate;border-spacing:0;font-size:calc(.82rem - 2px)}thead{position:sticky;top:0;z-index:10}th{width:1%;height:36px;padding:8px 7px;white-space:nowrap;text-align:center;line-height:1.35;vertical-align:middle;color:#fff;background:var(--azul);border-right:1px solid rgba(255,255,255,.25);border-bottom:1px solid var(--azul-oscuro)}.filtro-celda{height:34px;padding:4px;background:#dbeafe;border-right:1px solid #bfdbfe;border-bottom:1px solid #93c5fd}.filtro-select{width:100%;min-width:72px;height:26px;padding:2px 22px 2px 5px;color:#172033;background:#fff;border:1px solid #93c5fd;border-radius:5px;font:inherit;cursor:pointer}.filtro-select:focus{outline:2px solid #2563eb;outline-offset:1px}
    td{width:1%;height:32px;padding:6px 7px;white-space:nowrap;text-align:center;line-height:1.35;vertical-align:middle;border-right:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0}td.celda-color{font-weight:700;border-bottom-color:rgba(15,23,42,.16)}td.fecha-semana{color:#713f12;background:#fde68a;font-weight:700}td.estado-coincide{color:#166534;background:#dcfce7;font-weight:700}td.estado-falta{color:#991b1b;background:#fee2e2;font-weight:700}td.estado-sin-ingreso{color:#854d0e;background:#fef3c7;font-weight:700}th:last-child,td:last-child{border-right:0}tbody tr:nth-child(even){background:var(--alternada)}tbody tr:hover{background:var(--hover)}.cargando td,.sin-datos td{height:125px;color:var(--suave);font-size:.95rem;text-align:center}.tabla-contenedor::-webkit-scrollbar{width:14px;height:14px}.tabla-contenedor::-webkit-scrollbar-track{background:#e2e8f0}.tabla-contenedor::-webkit-scrollbar-thumb{background:#64748b;border:3px solid #e2e8f0;border-radius:10px}
    @media(max-width:700px){.pagina{padding:7px;gap:7px}.encabezado{align-items:stretch;flex-direction:column;padding:11px;gap:8px}h1,.actualizacion{text-align:center}h1{font-size:1.05rem}.contador{width:100%}.pestanas{padding:5px}.pestana{flex:1 0 auto;font-size:.78rem}table{font-size:calc(.75rem - 2px)}th{height:34px;padding:7px 6px}td{height:30px;padding:5px 6px}}
  </style>
</head>
<body>
  <main class="pagina">
    <header class="encabezado"><div><h1>Control de Remitos de Origen</h1><div id="actualizacion" class="actualizacion">Cargando información...</div></div><div id="contador" class="contador"><span id="cantidad" class="contador-numero">0</span><span id="contador-texto" class="contador-texto">Registros</span></div></header>
    <nav class="pestanas" aria-label="Vistas del control"><button class="pestana activa" type="button" data-vista="detalle">Detalle de ingresos</button><button class="pestana" type="button" data-vista="cruce">Cruce API Forestal <span id="insignia-cruce" class="insignia">0</span></button></nav>
    <div id="estado" class="estado" role="alert"></div>
    <section class="tabla-contenedor" aria-label="Control de remitos de origen"><table><thead><tr id="encabezados"></tr><tr id="filtros"></tr></thead><tbody id="cuerpo-tabla"><tr class="cargando"><td>Cargando datos...</td></tr></tbody></table></section>
  </main>
  <script>
    const URL_INGRESOS="/api/datos";
    const URL_FAS_REMITOS="/api/fas-remitos";
    const encabezadosElemento=document.getElementById("encabezados");
    const filtrosElemento=document.getElementById("filtros");
    const cuerpoElemento=document.getElementById("cuerpo-tabla");
    const actualizacionElemento=document.getElementById("actualizacion");
    const cantidadElemento=document.getElementById("cantidad");
    const contadorElemento=document.getElementById("contador");
    const contadorTextoElemento=document.getElementById("contador-texto");
    const estadoElemento=document.getElementById("estado");
    const insigniaCruceElemento=document.getElementById("insignia-cruce");
    const COLUMNAS_CON_COLOR=new Set(["deposito","certificacion","origen","nombreprod2"]);
    const COLUMNAS_COLOR_COMPARTIDO=new Set(["cosecha","sacada","carga","carga_api"]);
    const COLUMNAS_CRUCE=["fecha","remito_origen_api","estado_cruce","rtoorigen_sistema","remito","vehiculo","predio","pila","producto","destino","carga_api","carga"];
    let vistaActiva="detalle",columnasActuales=[],registrosOriginales=[],registrosDetalle=[],registrosCruce=[],columnasDetalle=[],actualizadoIngresos="",errorCruce="";

    const nombreVisible=columna=>{const n=String(columna).toLowerCase();const d={anio_mes:"AÑO MES",fecha:"FECHA",remito_origen_api:"REMITO ORIGEN API",rtoorigen_sistema:"RTOORIGEN SISTEMA",estado_cruce:"ESTADO",vehiculo:"VEHÍCULO",carga_api:"CARGA API"};return d[n]||String(columna).replaceAll("_"," ").toUpperCase()};
    function textoLimpio(valor){if(valor===null||valor===undefined)return"";const t=String(valor).trim();return["nan","null","undefined"].includes(t.toLowerCase())?"":t}
    function formatearFecha(valor){const t=textoLimpio(valor);if(!t)return"";let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return`${m[3].padStart(2,"0")}/${m[2].padStart(2,"0")}/${m[1].slice(-2)}`;m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);return m?`${m[1].padStart(2,"0")}/${m[2].padStart(2,"0")}/${m[3].slice(-2)}`:t}
    function formatearAnioMes(valor){const t=textoLimpio(valor);if(!t)return"";const meses=["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];let m=t.match(/^(\d{4})-(\d{1,2})-/);if(m){const mes=Number(m[2]);return mes>=1&&mes<=12?`${m[1]} ${meses[mes-1]}`:""}m=t.match(/^\d{1,2}\/(\d{1,2})\/(\d{2,4})/);if(!m)return"";const mes=Number(m[1]);let anio=m[2];if(anio.length===2)anio=`20${anio}`;return mes>=1&&mes<=12?`${anio} ${meses[mes-1]}`:""}
    function formatearHora(valor){const t=textoLimpio(valor);if(!t)return"";const m=t.match(/(?:^|[ T])(\d{1,2}):(\d{2})(?::\d{2})?/);return m?`${m[1].padStart(2,"0")}:${m[2]}`:t}
    function convertirFechaADias(valor){const t=textoLimpio(valor);let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return Math.floor(Date.UTC(+m[1],+m[2]-1,+m[3])/86400000);m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(!m)return null;let a=+m[3];if(a<100)a+=2000;return Math.floor(Date.UTC(a,+m[2]-1,+m[1])/86400000)}
    function obtenerFechaUruguay(){const p=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Montevideo",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const v=Object.fromEntries(p.filter(x=>x.type!=="literal").map(x=>[x.type,x.value]));return{anio:+v.year,mes:+v.month,dia:+v.day}}
    function obtenerHoyUruguayEnDias(){const h=obtenerFechaUruguay();return Math.floor(Date.UTC(h.anio,h.mes-1,h.dia)/86400000)}
    function obtenerLimiteCuatroMesesEnDias(){const h=obtenerFechaUruguay();const f=new Date(Date.UTC(h.anio,h.mes-1,h.dia));f.setUTCMonth(f.getUTCMonth()-4);return Math.floor(f.getTime()/86400000)}
    function estaEnSemanaMovil(valor){const f=convertirFechaADias(valor);if(f===null)return false;const h=obtenerHoyUruguayEnDias();return f>=h-7&&f<=h}
    function mostrarValor(columna,valor){const n=String(columna).toLowerCase();if(n==="fecharto"||n==="fecha")return formatearFecha(valor);if(n==="horarto"||n==="horasalida")return formatearHora(valor);return textoLimpio(valor)}
    function normalizarRemito(valor){const t=textoLimpio(valor).replace(/^A-/i,"").replace(/\.0+$/,"");return/^\d+$/.test(t)?t.replace(/^0+(?=\d)/,""):""}
    function normalizarCarga(valor){return textoLimpio(valor).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\b(SRL|SAS|SA|LTDA)\b/g,"").replace(/[^A-Z0-9]/g,"")}
    function extraerArray(r){if(Array.isArray(r))return r;if(Array.isArray(r?.datos))return r.datos;if(Array.isArray(r?.data))return r.data;if(Array.isArray(r?.results))return r.results;return[]}
    function obtenerCampo(r,nombres){for(const n of nombres)if(Object.prototype.hasOwnProperty.call(r,n))return r[n];return""}

    function prepararDetalle(contenido){const fuente=extraerArray(contenido);registrosDetalle=fuente.map(r=>({...r,anio_mes:formatearAnioMes(r.fecharto)}));let columnas=Array.isArray(contenido?.columnas)?[...contenido.columnas]:(registrosDetalle[0]?Object.keys(registrosDetalle[0]):[]);columnas=columnas.filter(c=>!["nombrefas","anio_mes"].includes(String(c).toLowerCase()));const pos=columnas.findIndex(c=>String(c).toLowerCase()==="fecharto");columnas.splice(pos>=0?pos+1:0,0,"anio_mes");columnasDetalle=columnas}
    function prepararCruce(api,ingresos){const ingresosPorRto=new Map();ingresos.forEach(registro=>{const rto=normalizarRemito(registro.rtoorigen);if(rto&&!ingresosPorRto.has(rto))ingresosPorRto.set(rto,registro)});registrosCruce=api.map((registroApi,ordenApi)=>{const rtoApi=normalizarRemito(obtenerCampo(registroApi,["rtoorigen","RTOORIGEN","NÚMERO.1","NUMERO.1","número.1","numero.1","NÚMERO","NUMERO"])),fecha=obtenerCampo(registroApi,["FECHA DE CREACIÓN","FECHA DE CREACION","fecha de creación","fecha_creacion"]),sistema=ingresosPorRto.get(rtoApi)||{},encontrado=Boolean(rtoApi&&ingresosPorRto.has(rtoApi)),cargaApi=textoLimpio(obtenerCampo(registroApi,["CARGA","carga"])),cargaSistema=textoLimpio(sistema.carga),cargasCoinciden=Boolean(normalizarCarga(cargaApi)&&normalizarCarga(cargaApi)===normalizarCarga(cargaSistema)),estado=!encontrado?"SIN INGRESO":cargasCoinciden?"COINCIDE":"NO COINCIDE";return{fecha,remito_origen_api:rtoApi,estado_cruce:estado,rtoorigen_sistema:normalizarRemito(sistema.rtoorigen),remito:textoLimpio(sistema.remito),vehiculo:obtenerCampo(registroApi,["VEHÍCULO","VEHICULO","vehiculo"]),predio:obtenerCampo(registroApi,["PREDIO","predio"]),pila:obtenerCampo(registroApi,["PILA","pila"]),producto:obtenerCampo(registroApi,["PRODUCTO","producto"]),destino:obtenerCampo(registroApi,["DESTINO","destino"]),carga_api:cargaApi,carga:cargaSistema,_ordenApi:ordenApi}}).sort((a,b)=>{const numeroA=Number(a.remito_origen_api),numeroB=Number(b.remito_origen_api),validoA=Number.isFinite(numeroA),validoB=Number.isFinite(numeroB);if(validoA&&validoB)return numeroA-numeroB;if(validoA)return-1;if(validoB)return 1;return a._ordenApi-b._ordenApi}).map(({_ordenApi,...fila})=>fila)}

    function crearMapaColor(valores,inicio){const mapa=new Map();valores.forEach((v,i)=>{const tono=(i*137.508+inicio)%360,sat=68+(i%3)*5,luz=82+(i%2)*5;mapa.set(v,`hsl(${tono.toFixed(2)} ${sat}% ${luz}%)`)});return mapa}
    function crearMapasColores(columnas,registros){const mapas=new Map(),comp=columnas.filter(c=>COLUMNAS_COLOR_COMPARTIDO.has(String(c).toLowerCase()));const valores=[...new Set(registros.flatMap(r=>comp.map(c=>mostrarValor(c,r[c]).trim())).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es",{sensitivity:"base"}));const compartido=crearMapaColor(valores,205);comp.forEach(c=>mapas.set(String(c).toLowerCase(),compartido));columnas.forEach(c=>{const n=String(c).toLowerCase();if(!COLUMNAS_CON_COLOR.has(n))return;const v=[...new Set(registros.map(r=>mostrarValor(c,r[c]).trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es",{sensitivity:"base"}));mapas.set(n,crearMapaColor(v,18))});return mapas}
    function construirEncabezados(columnas){encabezadosElemento.replaceChildren();const f=document.createDocumentFragment();columnas.forEach(c=>{const th=document.createElement("th");th.scope="col";th.textContent=nombreVisible(c);f.appendChild(th)});encabezadosElemento.appendChild(f)}
    function construirFiltros(columnas,registros){filtrosElemento.replaceChildren();const f=document.createDocumentFragment();columnas.forEach(c=>{const th=document.createElement("th");th.className="filtro-celda";const s=document.createElement("select");s.className="filtro-select";s.dataset.columna=c;s.setAttribute("aria-label",`Filtrar ${nombreVisible(c)}`);const todos=document.createElement("option");todos.value="";todos.textContent="Todos";s.appendChild(todos);const valores=[...new Set(registros.map(r=>mostrarValor(c,r[c])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es",{numeric:true,sensitivity:"base"}));valores.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;s.appendChild(o)});s.addEventListener("change",aplicarFiltros);th.appendChild(s);f.appendChild(th)});filtrosElemento.appendChild(f)}
    function construirFilas(columnas,registros){cuerpoElemento.replaceChildren();if(!registros.length){const tr=document.createElement("tr");tr.className="sin-datos";const td=document.createElement("td");td.colSpan=Math.max(columnas.length,1);td.textContent="No hay registros para mostrar.";tr.appendChild(td);cuerpoElemento.appendChild(tr);return}const mapas=crearMapasColores(columnas,registrosOriginales),f=document.createDocumentFragment();registros.forEach(r=>{const tr=document.createElement("tr");columnas.forEach(c=>{const td=document.createElement("td"),v=mostrarValor(c,r[c]),n=String(c).toLowerCase();td.textContent=v;td.title=v;if((n==="fecharto"||n==="fecha")&&estaEnSemanaMovil(r[c]))td.classList.add("fecha-semana");if(n==="estado_cruce")td.classList.add(v==="COINCIDE"?"estado-coincide":v==="SIN INGRESO"?"estado-sin-ingreso":"estado-falta");const color=mapas.get(n)?.get(v.trim());if(color){td.classList.add("celda-color");td.style.backgroundColor=color}tr.appendChild(td)});f.appendChild(tr)});cuerpoElemento.appendChild(f)}
    function aplicarFiltros(){const filtros=[...filtrosElemento.querySelectorAll("select")].filter(s=>s.value!=="").map(s=>({columna:s.dataset.columna,valor:s.value}));const filas=registrosOriginales.filter(r=>filtros.every(x=>mostrarValor(x.columna,r[x.columna])===x.valor));construirFilas(columnasActuales,filas);cantidadElemento.textContent=filtros.length?`${filas.length.toLocaleString("es-UY")} / ${registrosOriginales.length.toLocaleString("es-UY")}`:registrosOriginales.length.toLocaleString("es-UY")}
    function mostrarError(mensaje,limpiar=true){if(limpiar){encabezadosElemento.replaceChildren();filtrosElemento.replaceChildren();cuerpoElemento.replaceChildren()}estadoElemento.textContent=mensaje;estadoElemento.className="estado error visible"}
    function mostrarVista(vista){vistaActiva=vista;document.querySelectorAll(".pestana").forEach(b=>b.classList.toggle("activa",b.dataset.vista===vista));estadoElemento.className="estado";estadoElemento.textContent="";if(vista==="detalle"){registrosOriginales=registrosDetalle;columnasActuales=columnasDetalle;contadorTextoElemento.textContent="Registros";contadorElemento.classList.remove("alerta");actualizacionElemento.textContent=actualizadoIngresos?`Actualizado: ${actualizadoIngresos}`:"Detalle de ingresos"}else{registrosOriginales=registrosCruce;columnasActuales=COLUMNAS_CRUCE;contadorTextoElemento.textContent="Registros API";contadorElemento.classList.remove("alerta");actualizacionElemento.textContent="Todos los registros de la API Forestal cruzados por RTOORIGEN";if(errorCruce)mostrarError(errorCruce,false)}construirEncabezados(columnasActuales);construirFiltros(columnasActuales,registrosOriginales);construirFilas(columnasActuales,registrosOriginales);cantidadElemento.textContent=registrosOriginales.length.toLocaleString("es-UY")}
    async function obtenerJson(url){const sep=url.includes("?")?"&":"?";const r=await fetch(`${url}${sep}t=${Date.now()}`,{cache:"no-store",headers:{Accept:"application/json"}});if(!r.ok)throw new Error(`Estado ${r.status}`);return r.json()}
    async function cargarDatos(){try{const ingresos=await obtenerJson(URL_INGRESOS);actualizadoIngresos=textoLimpio(ingresos.actualizado);prepararDetalle(ingresos);try{const api=await obtenerJson(URL_FAS_REMITOS);prepararCruce(extraerArray(api),registrosDetalle)}catch(e){console.error(e);errorCruce="No fue posible consultar la API de Forestal para realizar el cruce.";registrosCruce=[]}insigniaCruceElemento.textContent=registrosCruce.length.toLocaleString("es-UY");mostrarVista("detalle")}catch(e){console.error(e);mostrarError("No se pudo cargar el JSON de ingresos desde el servidor.");actualizacionElemento.textContent="Información no disponible";cantidadElemento.textContent="0"}}
    document.querySelectorAll(".pestana").forEach(b=>b.addEventListener("click",()=>mostrarVista(b.dataset.vista)));
    cargarDatos();
  </script>
</body>
</html>
